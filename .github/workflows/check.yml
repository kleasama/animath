name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: System packages (mirror docker/Dockerfile)
        timeout-minutes: 10
        run: >
          sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends
          ffmpeg pandoc libcairo2-dev libpango1.0-dev pkg-config dvisvgm espeak-ng libosmesa6
          texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science
          texlive-extra-utils
      - name: Speech Rule Engine
        run: npm install -g speech-rule-engine@4.1.4 mathjax-full@3.2.1 && echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - run: make setup
      - run: make check 2>&1 | tee check.log
        shell: bash
      - name: Failure summary
        if: failure()
        run: echo "::error title=make check::$(tail -n 40 check.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
