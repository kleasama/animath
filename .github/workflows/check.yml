name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: System packages (mirror docker/Dockerfile)
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          ffmpeg pandoc libcairo2-dev libpango1.0-dev pkg-config dvisvgm espeak-ng libosmesa6
          texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science
          texlive-extra-utils
      - run: make setup
      - run: make check
