[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "animath"
version = "0.1.0"
description = "Mathematical source to educational video."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Klearchos Samaras", email = "kleasama@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11,<2",
    "jsonschema>=4.25,<5",
    "lark>=1.2,<2",
    "manim>=0.21,<0.22",
    "matplotlib>=3.10,<4",
    "numpy>=2.3,<3",
    "onnxruntime>=1.23",
    "pillow>=12.3,<13",
    "pydantic>=2.13,<3",
    "pypandoc-binary>=1.17,<2",
    "pypdfium2>=5.14,<6",
    "pyvista>=0.49,<0.50",
    "scipy>=1.16",
    "sympy>=1.14,<2",
]

[project.urls]
Repository = "https://github.com/kleasama/animath"

[project.scripts]
animath = "animath.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.14", "mypy>=1.18", "pip-licenses>=5", "scipy-stubs>=1.16", "types-jsonschema>=4.25"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=animath --cov-branch --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]
