[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "animath"
version = "0.1.0"
description = "Mathematical source to educational video."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.13,<3", "anthropic>=1.11,<2", "numpy>=2.3", "onnxruntime>=1.23"]

[project.scripts]
animath = "animath.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.14", "mypy>=1.18", "pip-licenses>=5"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=animath --cov-branch --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]
